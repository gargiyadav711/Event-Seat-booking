<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event seat Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    
    <div class="website">
        <nav class="navbar">
            <div class="logo">
                <div class="logo-icon">E</div>
                <span>Event Booking</span>
            </div>
            <div class="nav-links">
                <a href="#">My Bookings</a>
                <a href="#">About us</a>
                <a href="#">Contact us</a>
            </div>
            <div class="auth-buttons"  id="auth">
                <button class="signup" id="signupBtn">Sign up</button>
            </div>
            <div class="signup-popup" id="signupPopup">
                <span class="close-btn" onclick="closeSignup()">&times;</span>
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="phone" placeholder="Phone Number" required>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </nav>
        <section class="hero">
            <div class="hero-content">
                <h1>Event seat Booking</h1>
                <p>Skip the line and lock in your experience before the venue fills up. Book your tickets online and
                    enjoy the event without any hassle.</p>
            </div>
        </section>
    </div>
    <div class="event-card">
        <div class="event-list">
            <div class="event_card1"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
